[project]
name = "alerts"
version = "0.1.0"
description = "Hazard forecasts of Ukrainian air raid alerts per oblast"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "lightgbm>=4.5",
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    "shapely>=2.2.0",
    "telethon>=1.45.0",
    "typer>=0.12",
]

[project.scripts]
alerts = "alerts.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alerts"]
